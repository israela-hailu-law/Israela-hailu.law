<title>עו"ד ישראלה הילו | עורכת דין - דיני תעבורה</title>

<meta
  name="description"
  content="עו&quot;ד ישראלה הילו - עורכת דין המתמחה בדיני תעבורה, משרד הרישוי, עתירות מנהליות והמכון הרפואי לבטיחות בדרכים"

  href="https://fonts.gstatic.com"

  rel="stylesheet"
>


<style>

/* =========================================================
   VARIABLES
   ========================================================= */

:root{

  --cream:#EDEBE8;
  --taupe:#76665B;
  --maze:#544B42;
  --navy:#1F3248;

  --bg-deep:#0a0d11;

  --footer-navy:#1c3247;

  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);

  --footer-height:32px;
}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  background:var(--bg-deep);
}


body{

  font-family:'Heebo', sans-serif;

  color:var(--cream);

  -webkit-font-smoothing:antialiased;

  text-rendering:optimizeLegibility;

  overscroll-behavior:none;
}


/* =========================================================
   MAIN CARD
   ========================================================= */

.card{

  position:relative;

  width:100%;

  max-width:560px;

  height:100vh;

  height:100dvh;

  min-height:100vh;

  min-height:100dvh;

  margin:0 auto;

  overflow:hidden;

  background:var(--bg-deep);
}


/* =========================================================
   PHOTO / BACKGROUND LAYER
   =========================================================

   התמונה היא עכשיו הרקע של כל המסך.

   היא לא נמצאת מתחת ל-header.

   כל שאר האלמנטים יושבים מעליה.
   ========================================================= */

.photo-zone{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:var(--bg-deep);

  z-index:0;
}


/* =========================================================
   PORTRAIT
   ========================================================= */

.portrait{
  position:absolute;

  width:100%;
  height:110%;

  left:0;
  top:15px;

  display:block;

  object-fit:cover;
  object-position:center top;

  background:transparent;

  z-index:0;
}


/* =========================================================
   DARK GRADIENT OVER PHOTO
   =========================================================

   השחור נמצא רק בחלק התחתון,
   כדי שהכפתורים והאייקונים יהיו ברורים.

   אין שכבה שחורה בחלק העליון.
   ========================================================= */

.photo-zone::after{

  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:0;

  height:46%;

  background:linear-gradient(
    to top,
    rgba(10,13,17,0.92) 0%,
    rgba(10,13,17,0.70) 24%,
    rgba(10,13,17,0.34) 52%,
    rgba(10,13,17,0.08) 78%,
    rgba(10,13,17,0) 100%
  );

  pointer-events:none;

  z-index:1;
}


/* =========================================================
   HEADER
   =========================================================

   הלוגו וההתמחויות נמצאים מעל התמונה.
   ========================================================= */

.header{

  position:relative;

  z-index:2;

  width:100%;

  padding-top:
    calc(26px + var(--safe-t));

  padding-bottom:18px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:22px;

  background:transparent;
}


/* =========================================================
   LOGO
   ========================================================= */

.logo{

  width:clamp(200px, 63vw, 290px);

  color:var(--taupe);

  flex:none;

  filter:drop-shadow(
    0 2px 5px rgba(0,0,0,0.20)
  );
}


.logo svg{

  display:block;

  width:100%;

  height:auto;
}


/* =========================================================
   PRACTICE AREAS
   ========================================================= */

.practice-grid{

  width:100%;

  padding-inline:14px;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  align-items:center;

  gap:10px 12px;
}


.chip{

  appearance:none;

  flex:0 0 auto;

  width:max-content;

  max-width:calc(100vw - 32px);

  min-height:42px;

  padding:9px 15px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  white-space:nowrap;

  border-radius:22px;

  color:var(--cream);

  font-family:inherit;

  font-size:13px;

  font-weight:400;

  line-height:1.2;

  background:rgba(40,38,37,0.22);

  border:1px solid rgba(237,235,232,0.34);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  box-shadow:

    0 5px 14px rgba(0,0,0,0.28),

    inset 0 1px 0 rgba(255,255,255,0.10);
}


/* =========================================================
   BOTTOM CONTENT
   =========================================================

   הכפתורים והסושיאל ממוקמים ביחס לתחתית.

   הם לא משפיעים על מיקום הפוטר.
   ========================================================= */

.bottom-stack{

  position:absolute;

  left:0;

  right:0;

  bottom:
    calc(
      var(--footer-height)
      + var(--safe-b)
      + 18px
    );

  width:100%;

  padding:
    0
    clamp(14px, 5vw, 24px);

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:16px;

  z-index:3;
}


/* =========================================================
   CONTACT BUTTONS
   ========================================================= */

.contact-row{

  display:flex;

  gap:8px;

  width:100%;

  max-width:460px;
}


.pill{

  flex:1;

  min-width:0;

  height:44px;

  padding:0 9px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:30px;

  text-align:center;

  white-space:nowrap;

  text-decoration:none;

  color:var(--cream);

  font-family:inherit;

  font-size:15px;

  font-weight:500;

  line-height:1;

  background:rgba(118,102,91,0.48);

  border:1px solid rgba(237,235,232,0.28);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  box-shadow:

    0 5px 14px rgba(0,0,0,0.35),

    inset 0 1px 0 rgba(255,255,255,0.12);

  -webkit-tap-highlight-color:
    rgba(237,235,232,0.15);
}


.pill-primary,
.pill-secondary{

  background:rgba(118,102,91,0.48);

  color:var(--cream);

  border:1px solid rgba(237,235,232,0.28);

  font-weight:500;
}


/* =========================================================
   SOCIAL
   ========================================================= */

.social-row{

  display:flex;

  flex-direction:row;

  align-items:center;

  justify-content:center;

  gap:14px;
}


.social-btn{

  width:42px;

  height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-decoration:none;

  background:transparent;

  border:none;

  color:var(--cream);

  -webkit-tap-highlight-color:
    rgba(237,235,232,0.15);
}


.social-btn svg{

  width:28px;

  height:28px;

  display:block;

  filter:drop-shadow(
    0 2px 4px rgba(0,0,0,0.25)
  );
}


/* =========================================================
   FOOTER
   =========================================================

   הפוטר מקובע לתחתית הכרטיס.

   שום דבר אחר לא יכול לדחוף אותו למעלה.
   ========================================================= */

.footer-bar{

  position:absolute;

  left:0;

  right:0;

  bottom:0;

  z-index:10;

  width:100%;

  height:
    calc(
      var(--footer-height)
      + var(--safe-b)
    );

  padding:
    0
    16px
    var(--safe-b);

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  background:var(--footer-navy);
}


/* =========================================================
   MAZE LOGO
   ========================================================= */

.maze-logo{

  width:62px;

  color:var(--maze);

  display:block;

  text-decoration:none;
}


.maze-logo svg{

  display:block;

  width:100%;

  height:auto;
}


/* =========================================================
   TOUCH
   ========================================================= */

@media (prefers-reduced-motion:no-preference){

  .pill,
  .social-btn{

    transition:
      transform .15s ease,
      opacity .15s ease;
  }


  .pill:active,
  .social-btn:active{

    transform:scale(0.96);

    opacity:0.85;
  }
}


/* =========================================================
   SMALL MOBILE SCREENS
   ========================================================= */

@media (max-height:700px){

  .header{

    padding-top:
      calc(16px + var(--safe-t));

    padding-bottom:12px;

    gap:14px;
  }


  .logo{

    width:clamp(
      185px,
      58vw,
      250px
    );
  }


  .practice-grid{

    gap:7px 9px;
  }


  .chip{

    min-height:38px;

    padding:7px 12px;

    font-size:12px;
  }


  .bottom-stack{

    bottom:
      calc(
        var(--footer-height)
        + var(--safe-b)
        + 12px
      );

    gap:10px;
  }


  .pill{

    height:42px;

    font-size:14px;
  }


  .social-btn{

    width:38px;

    height:38px;
  }


  .social-btn svg{

    width:25px;

    height:25px;
  }
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width:561px){

  body{

    min-height:100vh;

    display:flex;

    align-items:flex-start;

    justify-content:center;
  }


  .card{

    width:100%;

    max-width:560px;

    height:
      min(
        900px,
        calc(100vh - 48px)
      );

    min-height:680px;

    margin:24px auto;

    overflow:hidden;
  }


  .photo-zone{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;
  }


  .portrait{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center center;
  }


  .header{

    padding-top:28px;
  }


  .bottom-stack{

    bottom:
      calc(
        var(--footer-height)
        + 20px
      );
  }
}

</style>
